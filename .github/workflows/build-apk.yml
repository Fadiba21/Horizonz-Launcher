name: Build HorizonZ Launcher APK
on:
  push:
    branches: [ "main", "master", "android" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync-and-build:
    name: Sync HorizonZ History, Releases & Build APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
            clang_prefix: aarch64-linux-android28
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi
            clang_prefix: armv7a-linux-androideabi28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync Archive History, Source, Update ZIP & Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          git config user.name "Fadiba21"
          git config user.email "Fadiba21@users.noreply.github.com"
          git remote add archive "${GITHUB_SERVER_URL}/Fadiba21/Horizonz-Launcher-Archive.git" 2>/dev/null || true
          git fetch archive main --tags
          if [ ! -f ".fork_archive_synced" ]; then
            git merge --allow-unrelated-histories -s ours --no-commit archive/main || true
            git checkout archive/main -- packaging crates/horizon-android scripts tools Update 2>/dev/null || true
            python3 -c 'import pathlib; p=pathlib.Path("scripts/patch_horizon_direct_boot.py"); t=p.read_text(); s=t.index("fn sanitize_and_repair_horizon_mods("); e=t.index("fn apply_horizonz_custom_skin("); fn="fn sanitize_and_repair_horizon_mods(home: &std::path::Path) {\n    let d = home.join(\"horizon-mods\"); let _ = std::fs::create_dir_all(&d);\n    let Ok(es) = std::fs::read_dir(&d) else { return; };\n    for en in es.flatten() {\n        let p = en.path(); if !p.is_file() { continue; }\n        if !p.file_name().and_then(|n| n.to_str()).unwrap_or(\"\").ends_with(\".hmod\") { continue; }\n        let Ok(b) = std::fs::read(&p) else { continue; };\n        if b.len() <= 22 || b[0..4] != [0x50u8, 0x4Bu8, 0x03u8, 0x04u8] || !b.windows(16).any(|w| w == b\"horizon-mod.toml\") { let _ = std::fs::remove_file(&p); }\n    }\n}\n\n"; p.write_text(t[:s]+fn+t[e:])'
            echo "Synced v1.19" > .fork_archive_synced
            if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
              git checkout HEAD -- .github/workflows/ 2>/dev/null || true
              git add -A && git reset HEAD .github/workflows/ 2>/dev/null || true
              git commit -m "feat(horizonz): merge full HorizonZ Launcher source & commit history into horizon-rust/horizon fork" || true
              git push origin "HEAD:${GITHUB_REF_NAME}" || true
              for TAG in $(gh release list -R Fadiba21/Horizonz-Launcher-Archive --limit 20 --json tagName -q '.[].tagName' 2>/dev/null); do
                if ! gh release view "$TAG" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
                  mkdir -p "/tmp/rel_$TAG" && gh release download "$TAG" -R Fadiba21/Horizonz-Launcher-Archive -D "/tmp/rel_$TAG" || true
                  T="$(gh release view "$TAG" -R Fadiba21/Horizonz-Launcher-Archive --json name -q '.name' 2>/dev/null || echo "$TAG")"
                  N="$(gh release view "$TAG" -R Fadiba21/Horizonz-Launcher-Archive --json body -q '.body' 2>/dev/null || echo "$TAG")"
                  gh release create "$TAG" /tmp/rel_$TAG/* -R "${GITHUB_REPOSITORY}" --title "$T" --notes "$N" || gh release create "$TAG" -R "${GITHUB_REPOSITORY}" --title "$T" --notes "$N" || true
                fi
              done
            fi
          fi
          if [ -f "scripts/apply_update_zip.py" ]; then python3 scripts/apply_update_zip.py || true; rm -f .auto_update_applied.txt; fi
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.rust_target }}' }
      - uses: Swatinem/rust-cache@v2
        with: { key: 'horizon-fork-v119-${{ matrix.rust_target }}' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Compile Rust Engine & Assemble APK (${{ matrix.abi }})
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > packaging/android/local.properties
          SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          git clone --depth 1 --branch android "${GITHUB_SERVER_URL}/Vasysik/horizon-android.git" /tmp/up
          rsync -a --exclude='packaging/android' --exclude='.git' --exclude='.github' /tmp/up/ ./
          cp -f /tmp/up/packaging/android/bedrock-controls.json packaging/android/bedrock-controls.json || true
          rm -rf /tmp/up packaging/android/assets/bedrock-controls.json
          python3 scripts/patch_horizon_direct_boot.py
          mkdir -p .local/android/gradle-jni/${{ matrix.abi }} .local/android/gradle-assets
          if curl -fsSL -L "${GITHUB_SERVER_URL}/Vasysik/horizon-android/releases/download/v0.7.4/Horizon-Android-0.7.4-${{ matrix.abi }}.apk" -o /tmp/u.apk; then
            unzip -q -o /tmp/u.apk "assets/*" -d /tmp/udir && cp -rf /tmp/udir/assets/* .local/android/gradle-assets/ || true
          fi
          python3 scripts/prestage_controls_and_wallpapers.py
          TBIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$TBIN:$PATH" HORIZON_ANDROID_PUBLIC=1 CARGO_PROFILE_RELEASE_LTO=false CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 CARGO_PROFILE_RELEASE_OPT_LEVEL=2
          TU="$(echo "${{ matrix.rust_target }}" | tr '-' '_')"
          TUP="$(echo "$TU" | tr '[:lower:]' '[:upper:]')"
          export "CC_${TU}=$TBIN/${{ matrix.clang_prefix }}-clang" "CXX_${TU}=$TBIN/${{ matrix.clang_prefix }}-clang++" "AR_${TU}=$TBIN/llvm-ar" "CARGO_TARGET_${TUP}_LINKER=$TBIN/${{ matrix.clang_prefix }}-clang"
          EARGS=""; if [ "${{ matrix.abi }}" = "armeabi-v7a" ]; then EARGS="--no-default-features --features audio"; fi
          cargo build --release -p horizon-android --target ${{ matrix.rust_target }} $EARGS
          cp -f "target/${{ matrix.rust_target }}/release/libhorizon_android.so" ".local/android/gradle-jni/${{ matrix.abi }}/libhorizon_android.so"
          "$TBIN/llvm-strip" --strip-unneeded ".local/android/gradle-jni/${{ matrix.abi }}/libhorizon_android.so" || true
          cd packaging/android
          if [ ! -f debug.keystore ]; then keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"; fi
          gradle assembleRelease -Pabi=${{ matrix.abi }} -PminSdk=28 --no-daemon
          mkdir -p ../../dist
          APK="$(find build/outputs/apk/release ../../.local/android/gradle-build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)"
          cp -f "$APK" "../../dist/HorizonZ-Launcher-1.19-${{ matrix.abi }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: HorizonZ-Launcher-1.19-${{ matrix.abi }}
          path: dist/HorizonZ-Launcher-1.19-${{ matrix.abi }}.apk
