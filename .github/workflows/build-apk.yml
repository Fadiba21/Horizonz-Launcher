name: Build HorizonZ Launcher APK

on:
  push:
    branches: [ "main", "master", "android" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "android" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-horizonz-apk:
    name: Build HorizonZ Real Engine APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
            clang_prefix: aarch64-linux-android28
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi
            clang_prefix: armv7a-linux-androideabi28

    steps:
      - name: Checkout HorizonZ - Launcher
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Install Platform 35 + NDK 28.2.13676358
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > packaging/android/local.properties

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Rust Toolchain (${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Clone Real Vasysik/horizon-android Engine Workspace & Apply Direct-Boot Patch
        run: |
          rm -rf /tmp/horizon-upstream
          git clone --depth 1 --branch android https://github.com/Vasysik/horizon-android.git /tmp/horizon-upstream
          # Copy the real Rust workspace crates, third_party, mods, Cargo.toml, Cargo.lock, research-lock.json
          # while preserving HorizonZ's packaging/android UI and scripts
          rsync -a --exclude='packaging/android' --exclude='.git' --exclude='.github' /tmp/horizon-upstream/ ./
          rm -rf /tmp/horizon-upstream

          # Patch launcher.rs for direct game boot (game::android_game()) and android_main.rs for JNI official_install hooks
          python3 scripts/patch_horizon_direct_boot.py
          # Upstream workspace pins Rust in rust-toolchain.toml; install the target after syncing it.
          rustup target add "${{ matrix.rust_target }}"

      - name: Cache Rust Engine Build
        uses: Swatinem/rust-cache@v2
        with:
          key: horizon-real-engine-${{ matrix.rust_target }}

      - name: Compile Real Horizon Rust Engine (libhorizon_android.so) & Stage Assets (${{ matrix.abi }})
        run: |
          mkdir -p .local/android/gradle-jni/${{ matrix.abi }}
          mkdir -p .local/android/gradle-assets
          cp -f LICENSE .local/android/gradle-assets/LICENSE.txt || cp -f LICENSE.txt .local/android/gradle-assets/LICENSE.txt || true
          cp -f THIRD_PARTY_NOTICES.md .local/android/gradle-assets/ || true

          # Extract official engine-data.zip from Vasysik/horizon-android v0.7.3 release into assets
          APK_URL="https://github.com/Vasysik/horizon-android/releases/download/v0.7.3/Horizon-Android-0.7.3-${{ matrix.abi }}.apk"
          if curl -fsSL -L "$APK_URL" -o /tmp/upstream_assets.apk; then
            unzip -q -o /tmp/upstream_assets.apk "assets/*" -d /tmp/upstream_assets_dir || true
            if [ -d "/tmp/upstream_assets_dir/assets" ]; then
              cp -rf /tmp/upstream_assets_dir/assets/* .local/android/gradle-assets/ || true
            fi
            rm -rf /tmp/upstream_assets.apk /tmp/upstream_assets_dir
          fi

          TOOLCHAIN_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export HORIZON_ANDROID_PUBLIC=1
          export CARGO_PROFILE_RELEASE_LTO=false
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          export CARGO_PROFILE_RELEASE_OPT_LEVEL=2

          TRIPLE_UNDERSCORE="$(echo "${{ matrix.rust_target }}" | tr '-' '_')"
          TRIPLE_UPPER="$(echo "$TRIPLE_UNDERSCORE" | tr '[:lower:]' '[:upper:]')"
          export "CC_${TRIPLE_UNDERSCORE}=$TOOLCHAIN_BIN/${{ matrix.clang_prefix }}-clang"
          export "CXX_${TRIPLE_UNDERSCORE}=$TOOLCHAIN_BIN/${{ matrix.clang_prefix }}-clang++"
          export "AR_${TRIPLE_UNDERSCORE}=$TOOLCHAIN_BIN/llvm-ar"
          export "CARGO_TARGET_${TRIPLE_UPPER}_LINKER=$TOOLCHAIN_BIN/${{ matrix.clang_prefix }}-clang"

          cargo build --release -p horizon-android --target ${{ matrix.rust_target }}
          cp -f "target/${{ matrix.rust_target }}/release/libhorizon_android.so" ".local/android/gradle-jni/${{ matrix.abi }}/libhorizon_android.so"
          "$TOOLCHAIN_BIN/llvm-strip" --strip-unneeded ".local/android/gradle-jni/${{ matrix.abi }}/libhorizon_android.so" || true
          ls -lh ".local/android/gradle-jni/${{ matrix.abi }}/libhorizon_android.so"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Signing Keystore & Assemble APK (${{ matrix.abi }})
        working-directory: packaging/android
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          set +e
          gradle assembleRelease -Pabi=${{ matrix.abi }} -PminSdk=28 --no-daemon --stacktrace 2>&1 | tee gradle_build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$GRADLE_EXIT" -ne 0 ]; then
            echo "### Gradle Build Error Log (${{ matrix.abi }})" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 gradle_build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$GRADLE_EXIT"
          fi
          mkdir -p ../../dist
          APK_FOUND="$(find build/outputs/apk/release ../../.local/android/gradle-build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)"
          cp -f "$APK_FOUND" "../../dist/HorizonZ-Launcher-0.9.0-${{ matrix.abi }}.apk"
          ls -lh ../../dist/

      - name: Upload APK Artifact (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: HorizonZ-Launcher-0.9.0-${{ matrix.abi }}
          path: dist/HorizonZ-Launcher-0.9.0-${{ matrix.abi }}.apk
          if-no-files-found: error

  publish-release:
    name: Publish HorizonZ - Launcher Release APKs
    needs: build-horizonz-apk
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download All Built APK Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-apks
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: release-apks
        run: |
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh

      - name: Create or Update Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.0-horizonz-build-${{ github.run_number }}
          name: "HorizonZ - Launcher v0.9.0 (Build #${{ github.run_number }} • Real Horizon 26.3 Engine + Asset Installer + Clean Zalith UI)"
          body: |
            ## HorizonZ - Launcher v0.9.0 (Real Minecraft 26.3 Rust Engine + Built-in Asset Downloader + Clean Zalith UI)
            - **Real `Vasysik/horizon-android` + `horizon-rust/horizon` Engine Compiled from Source**: Clones the full `Vasysik/horizon-android` Rust workspace (`crates/horizon-client`, `crates/horizon-world`, `crates/horizon-assets`, `crates/horizon-protocol`, `wgpu`) and compiles `libhorizon_android.so` natively.
            - **Built-in Official Minecraft 26.3 Game & Asset Downloader (`official_install`)**: Download and prepare the full Minecraft 26.3 client, server, textures, sounds, and worldgen data directly from the Zalith Material 3 Android UI via JNI (`nativeStartOfficialInstall`, `nativeGetInstallProgress`).
            - **Direct Boot into `game::android_game()`**: Patched `crates/horizon-client/src/android/launcher.rs` so clicking **PLAY** skips Vasysik's built-in Rust launcher menu and boots straight into the real Minecraft 26.3 Rust game.
          files: |
            release-apks/*.apk
            release-apks/SHA256SUMS.txt
          prerelease: false
