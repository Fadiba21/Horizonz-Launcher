name: Build HorizonZ Launcher APK

on:
  push:
    branches: [ "main", "master", "android" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "android" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update-zip:
    name: Auto-Extract Update/ ZIP to Main Source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check & Extract Any ZIP in Update/ Folder Over Main Source
        continue-on-error: true
        run: |
          set +e
          python3 scripts/apply_update_zip.py
          PY_EXIT=$?
          if [ $PY_EXIT -ne 0 ]; then
            echo "::warning::apply_update_zip.py exited with $PY_EXIT; continuing."
          fi
          if [ -f ".auto_update_applied.txt" ]; then
            APPLIED_ZIPS="$(cat .auto_update_applied.txt)"
            rm -f .auto_update_applied.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore(auto-update): extract ${APPLIED_ZIPS} from Update/ into main source" || true
              if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "Note: Retrying commit without .github/workflows/..."
                git reset --soft HEAD~1 || true
                git checkout HEAD -- .github/workflows/ || true
                git add -A
                if ! git diff --cached --quiet; then
                  git commit -m "chore(auto-update): extract ${APPLIED_ZIPS} from Update/ into main source" || true
                  git push origin "HEAD:${GITHUB_REF_NAME}" || true
                fi
              fi
              echo "### Auto-Update Applied" >> "$GITHUB_STEP_SUMMARY"
              echo "Extracted **${APPLIED_ZIPS}** from \`Update/\` and overwrote main repository source code." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          exit 0

  build-horizonz-apk:
    name: Build HorizonZ 1.4 APK (${{ matrix.abi }})
    needs: apply-update-zip
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
            clang_prefix: aarch64-linux-android28
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi
            clang_prefix: armv7a-linux-androideabi28

    steps:
      - name: Checkout Latest Main Source (After Any Update/ ZIP Extraction)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Ensure Any Remaining Update/ ZIP is Applied in Build Workspace
        run: |
          python3 scripts/apply_update_zip.py
          rm -f .auto_update_applied.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Install Platform 35 + NDK 28.2.13676358
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > packaging/android/local.properties

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

          NDK_VERSION="28.2.13676358"
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
          for attempt in 1 2 3; do
            if [ -f "$NDK_DIR/source.properties" ]; then
              break
            fi

            echo "Installing Android NDK $NDK_VERSION (attempt $attempt/3)"
            if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "ndk;$NDK_VERSION" && [ -f "$NDK_DIR/source.properties" ]; then
              break
            fi

            rm -rf "$NDK_DIR" "$ANDROID_HOME/temp"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Unable to install Android NDK $NDK_VERSION after 3 attempts."
              exit 1
            fi
            sleep "$((attempt * 10))"
          done

          test -f "$NDK_DIR/source.properties"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Set up Rust Toolchain (${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Clone Real Vasysik/horizon-android Engine Workspace & Apply Direct-Boot Patch
        run: |
          rm -rf /tmp/horizon-upstream
          git clone --depth 1 --branch android https://github.com/Vasysik/horizon-android.git /tmp/horizon-upstream
          rsync -a --exclude='packaging/android' --exclude='.git' --exclude='.github' /tmp/horizon-upstream/ ./
          if [ -f "/tmp/horizon-upstream/packaging/android/bedrock-controls.json" ]; then
            cp -f "/tmp/horizon-upstream/packaging/android/bedrock-controls.json" packaging/android/bedrock-controls.json
          fi
          rm -rf /tmp/horizon-upstream
          rm -f packaging/android/assets/bedrock-controls.json

          python3 scripts/patch_horizon_direct_boot.py
          rustup target add "${{ matrix.rust_target }}"

      - name: Cache Rust Engine Build
        uses: Swatinem/rust-cache@v2
        with:
          key: horizon-real-engine-v14-${{ matrix.rust_target }}

      - name: Compile Real Horizon Rust Engine (libhorizon_android.so) & Stage Assets (${{ matrix.abi }})
        run: |
          mkdir -p .local/android/gradle-jni/${{ matrix.abi }}
          mkdir -p .local/android/gradle-assets
          cp -f LICENSE .local/android/gradle-assets/LICENSE.txt || cp -f LICENSE.txt .local/android/gradle-assets/LICENSE.txt || true
          cp -f THIRD_PARTY_NOTICES.md .local/android/gradle-assets/ || true

          APK_URL="https://github.com/Vasysik/horizon-android/releases/download/v0.7.3/Horizon-Android-0.7.3-${{ matrix.abi }}.apk"
          if curl -fsSL -L "$APK_URL" -o /tmp/upstream_assets.apk; then
            unzip -q -o /tmp/upstream_assets.apk "assets/*" -d /tmp/upstream_assets_dir || true
            if [ -d "/tmp/upstream_assets_dir/assets" ]; then
              cp -rf /tmp/upstream_assets_dir/assets/* .local/android/gradle-assets/ || true
            fi
            rm -rf /tmp/upstream_assets.apk /tmp/upstream_assets_dir
          fi

          TOOLCHAIN_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export HORIZON_ANDROID_PUBLIC=1
          export CARGO_PROFILE_RELEASE_LTO=false
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          export CARGO_PROFILE_RELEASE_OPT_LEVEL=2

          TRIPLE_UNDERSCORE="$(echo "${{ matrix.rust_target }}" | tr '-' '_')"
          TRIPLE_UPPER="$(echo "$TRIPLE_UNDERSCORE" | tr '[:lower:]' '[:upper:]')"
          export "CC_${TRIPLE_UNDERSCORE}=$TOOLCHAIN_BIN/${{ matrix.clang_prefix }}-clang"
          export "CXX_${TRIPLE_UNDERSCORE}=$TOOLCHAIN_BIN/${{ matrix.clang_prefix }}-clang++"
          export "AR_${TRIPLE_UNDERSCORE}=$TOOLCHAIN_BIN/llvm-ar"
          export "CARGO_TARGET_${TRIPLE_UPPER}_LINKER=$TOOLCHAIN_BIN/${{ matrix.clang_prefix }}-clang"

          cargo build --release -p horizon-android --target ${{ matrix.rust_target }}
          cp -f "target/${{ matrix.rust_target }}/release/libhorizon_android.so" ".local/android/gradle-jni/${{ matrix.abi }}/libhorizon_android.so"
          "$TOOLCHAIN_BIN/llvm-strip" --strip-unneeded ".local/android/gradle-jni/${{ matrix.abi }}/libhorizon_android.so" || true
          ls -lh ".local/android/gradle-jni/${{ matrix.abi }}/libhorizon_android.so"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Signing Keystore & Assemble APK (${{ matrix.abi }})
        working-directory: packaging/android
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          set +e
          gradle assembleRelease -Pabi=${{ matrix.abi }} -PminSdk=28 --no-daemon --stacktrace 2>&1 | tee gradle_build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$GRADLE_EXIT" -ne 0 ]; then
            echo "### Gradle Build Error Log (${{ matrix.abi }})" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 gradle_build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$GRADLE_EXIT"
          fi
          mkdir -p ../../dist
          APK_FOUND="$(find build/outputs/apk/release ../../.local/android/gradle-build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)"
          cp -f "$APK_FOUND" "../../dist/HorizonZ-Launcher-1.4-${{ matrix.abi }}.apk"
          ls -lh ../../dist/

      - name: Upload APK Artifact (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: HorizonZ-Launcher-1.4-${{ matrix.abi }}
          path: dist/HorizonZ-Launcher-1.4-${{ matrix.abi }}.apk
          if-no-files-found: error

  publish-release:
    name: Publish HorizonZ 1.4 Release APKs
    needs: build-horizonz-apk
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download All Built APK Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-apks
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: release-apks
        run: |
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh

      - name: Create or Update Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0-horizonz-build-${{ github.run_number }}
          name: "HorizonZ - Launcher v1.4 (Build #${{ github.run_number }} • Auto-Update Folder System + Material You UI)"
          body: |
            ## HorizonZ - Launcher v1.4
            - **Auto-Extract `Update/` Folder System**: Upload any future `HorizonZ*.zip` into the `Update/` folder in the repository; GitHub Actions automatically extracts and overwrites the main repository source code, cleans up the `.zip`, commits to `main`, and builds the new Release APKs.
            - **Fixed `Missing control revision` Error**: Preserves upstream `packaging/android/bedrock-controls.json` during compile time (`include_str!`) and adds fallback control revision handling in `android_resources.rs`.
            - **Live System, Download & Minecraft Runtime Logs**: Expandable/minimizable Download Process Log directly below the progress indicator + full System & Game Log viewer with **Copy** button and **System Logs** toggle in Settings.
          files: |
            release-apks/*.apk
            release-apks/SHA256SUMS.txt
          prerelease: false
