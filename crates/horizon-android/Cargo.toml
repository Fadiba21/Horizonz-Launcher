[package]
name = "horizon-android"
version = "0.7.4"
edition = "2024"
description = "Android NativeActivity and JNI bridge for HorizonZ Launcher (Minecraft: Java Edition 26.3 in Rust)"
license = "MIT"

[lib]
name = "horizon_android"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
log = "0.4"
android_logger = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", features = ["native_app_glue"] }
ndk-sys = "0.6"
