[package]
name = "horizon-android"
version = "0.8.0"
edition = "2021"
description = "Native Android Rust Runtime & JNI Bridge for HorizonZ Launcher (Minecraft 26.3)"
license = "MIT"

[lib]
name = "horizon_android"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
log = "0.4"
android_logger = "0.15"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
