[workspace]
resolver = "2"
members = [
    "crates/horizon-android",
]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT AND GPL-3.0-only"
repository = "https://github.com/Fadiba21/Horizonz-Launcher"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "none"
panic = "abort"
