plugins {
    id 'com.android.application' version '8.7.3'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21'
}

def targetAbi = (project.findProperty('abi') ?: '').toString().trim()
def customMinSdk = Integer.parseInt((project.findProperty('minSdk') ?: '28').toString().trim())
def localKeystore = file('debug.keystore')

android {
    namespace 'dev.horizon.android'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.horizon.android'
        minSdk customMinSdk
        targetSdk 35
        versionCode 26
        versionName '1.1.0-HorizonZ'

        ndk {
            if (targetAbi != '') {
                abiFilters.add(targetAbi)
            } else {
                abiFilters.addAll(['arm64-v8a', 'armeabi-v7a'])
            }
        }
    }

    signingConfigs {
        debug {
            if (localKeystore.exists()) {
                storeFile localKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['java']
            res.srcDirs = ['res']
            jniLibs.srcDirs = ['../../.local/android/gradle-jni', 'jniLibs']
            assets.srcDirs = ['../../.local/android/gradle-assets', 'assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols.add('**/*.so')
        }
        resources {
            excludes.add('/META-INF/{AL2.0,LGPL2.1}')
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.10.01')
    implementation composeBom

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
